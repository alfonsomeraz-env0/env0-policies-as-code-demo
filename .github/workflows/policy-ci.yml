name: policy-ci

# Policies are code: they get a PR, a formatter, a type check and unit tests
# before env0 ever reads them from main.

on:
  pull_request:
    paths: ["policies/**", "tests/**", "app/**", "control-plane/**", "Makefile", ".github/workflows/**"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rego:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 0.46.1 is the OPA version the pr-label-approval-policy demo notes env0
        # runs. Pin ENV0_OPA_VERSION in env0 and here to the same value.
        opa: ["0.46.1", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: ${{ matrix.opa }}
      - run: make check
      - run: make test
      # Formatting rules change between OPA releases, so only gate on latest.
      - if: matrix.opa == 'latest'
        run: make fmt-check

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: make validate
